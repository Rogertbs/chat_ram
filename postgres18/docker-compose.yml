name: chat-ram-postgres18

services:
  postgres18:
    build:
      context: .
      dockerfile: Dockerfile
    image: chat-ram/postgres18-rag:18.6-vector0.8.6-textsearch1.4.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: otrs
      POSTGRES_PASSWORD: ${POSTGRES18_PASSWORD:?Configure POSTGRES18_PASSWORD no .env}
      POSTGRES_DB: otrs
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_textsearch
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
    shm_size: 512mb
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./init/001-extensions.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otrs -d otrs"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      rag_data:
        aliases: [postgres18]

volumes:
  postgres18_data:

networks:
  rag_data:
    name: chat_ram_rag_data
