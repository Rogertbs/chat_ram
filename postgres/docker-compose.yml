name: otrs-postgres

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: otrs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
      POSTGRES_DB: otrs
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otrs -d otrs"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      otrs_migration:
        aliases: [postgres]

volumes:
  postgres_data:

networks:
  otrs_migration:
    external: true
    name: otrs_migration
